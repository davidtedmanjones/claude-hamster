# Hamster keybindings — sourced by `hamster start`.
# Comfier second prefix (Ctrl-f) in addition to the default Ctrl-b.
# (Ctrl-f's only cost: forward-char in the input line — use the arrow key.)
set -g prefix2 C-f
# Mouse on for scroll-into-copy-mode and drag-select. Costs: wheel-up enters
# tmux copy-mode (q to leave), terminal-native selection needs Shift held.
set -g mouse on
# Plain drag-select copies to the system clipboard on release. Direct pipe
# because the OSC 52 route (set-clipboard) is silently dropped by some
# terminals; falls through macOS -> Wayland -> X11.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
# Comfortable window of time to tap a repeatable key again after the prefix.
set -g repeat-time 800
# Keep our session-title window names (don't let the running process rename them).
set -g automatic-rename off
set -g allow-rename off
# Left: the active session's full AI title + short uuid. The tab list
# truncates names and the per-window "3:session d71ba77" detail isn't useful, so
# we strip the window list down to just indexes and surface the current
# session's identity here instead.
set -g status-left-length 140
# Fixed-width name (truncate at 40, pad to 40) so the uuid sits at the same column
# whatever window you're on — the bar no longer shifts as names vary in length.
set -g status-left " #[bold]#{p40:#{=40:window_name}}#[default] #[fg=colour244]#{@hamster_sid}#[default] │ "
# Window list — colour-free state cues (legible regardless of colour vision):
#   selected   -> [N] in brackets + reverse video (brightness flip)
#   working    -> spinning ◐◓◑◒ next to the bold index (motion)
#   needs you  -> ❓ on a bold index (asking a question / waiting on input)
#   subagents  -> ⚒N (how many are fanned out) · snoozed 💤
#   icons stack, e.g.  5 ◐⚒3  or  4❓
# @hamster_state/@hamster_sub/@hamster_spin kept fresh by `hamster statusline` (~1s).
# Separator lives inside the format (trailing space) so a hidden window contributes
# nothing at all. When @hamster_hidesnooze is on, snoozed (non-current) windows render
# empty -> they vanish from the list until their snooze ends (F8 toggles it).
set -g window-status-separator ""
set -g window-status-format "#{?#{&&:#{@hamster_hidesnooze},#{==:#{@hamster_state},snoozed}},,#{?#{==:#{@hamster_state},working},#[bold]#I #{@hamster_spin}#[default],#{?#{==:#{@hamster_state},attention},#[bold]#I#[default]❓,#I}}#{?#{==:#{@hamster_state},snoozed},💤,}#{@hamster_sub} }"
set -g window-status-current-format "#[reverse] [#I] #[default]#{?#{==:#{@hamster_state},working},#{@hamster_spin},#{?#{==:#{@hamster_state},attention},❓,}}#{?#{==:#{@hamster_state},snoozed},💤,}#{@hamster_sub} "
# Right: live session counts (total / need-you / ready / working / snoozed).
set -g status-right-length 70
set -g status-right "#[fg=colour245]#('@HAMSTER@' statusline) "
set -g status-interval 5
# Neutral bar — state is shown by shape/brightness/motion (brackets, spinner, glyphs),
# never by colour alone, so it stays legible for colour-blind use.
set -g status-style "bg=colour236 fg=colour252"
# prefix + p : previous (the session you were just on)
# prefix + r : AI-name the current window from its chat
# prefix + R : force a full redraw (fixes a blank/garbled pane without detaching)
# prefix + ] : cycle forward through windows  (repeatable — tap again within ~0.8s)
# prefix + [ : cycle backward through windows (repeatable)
# prefix + Escape : copy-mode / scrollback (moved off '[' since that now cycles)
# prefix + x : close (end) the current session — window + state
bind-key -r "]" next-window
bind-key -r "[" previous-window
# F-keys and pickers live in the VS Code extension now (F4 jump, F3 snooze,
# F6 rename, F8 hide-snoozed, F11 new, F12 menu — native QuickPick overlays).
# tmux keeps only bare-terminal fallbacks for window stepping + hide toggle.
bind-key -n F1  run-shell "'@HAMSTER@' step prev"
bind-key -n F2  run-shell "'@HAMSTER@' step next"
bind-key -n F8 run-shell "'@HAMSTER@' hidesnooze"
bind-key Escape copy-mode
bind-key p last-window
bind-key x confirm-before -p "close this session? (y/n)" {run-shell "'@HAMSTER@' close"}
bind-key r run-shell -b "'@HAMSTER@' ai-name"
bind-key R refresh-client \; display-message "redrawn"
